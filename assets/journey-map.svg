<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1190" viewBox="0 0 1400 1190" role="img" aria-labelledby="title desc"><title id="title">My journey: from data foundations to business impact</title><desc id="desc">Five chapters from enterprise warehouses through Hadoop, open cloud architecture, business applications, and data and AI leadership. Two defining experiences: moving across three clouds while leadership evaluated platforms, and scaling a custom insights application globally.</desc><rect width="1400" height="1190" rx="20" fill="#f6f8fb"/><style>text{font-family:Arial,Helvetica,sans-serif}.label{font-size:15px;letter-spacing:2px;fill:#b5472b;font-weight:700}.title{font-size:42px;font-weight:700;fill:#1e2530}.small{font-size:20px;fill:#596575}.body{font-size:21px;fill:#344354}</style><text x="64" y="65" class="label">HIMANSHU GAURAV / MY JOURNEY</text><text x="64" y="126" class="title">From building platforms</text><text x="64" y="176" class="title">to enabling better decisions.</text><text x="64" y="218" class="small">Each chapter expanded what I paid attention to.</text><line x1="90" y1="296" x2="90" y2="726" stroke="#d8e0e9" stroke-width="3"/><rect x="124" y="258" width="1212" height="88" rx="10" fill="#fff" stroke="#dde4ed"/><rect x="64" y="281" width="52" height="42" rx="8" fill="#fff1ec" stroke="#ead1c7"/><text x="90" y="308" text-anchor="middle" font-size="18" fill="#b5472b">01</text><text x="148" y="287" class="label">DATA FOUNDATIONS</text><text x="148" y="319" font-size="20" font-weight="700" fill="#1e2530">Data marts → Teradata &amp; Netezza</text><text x="735" y="309" font-size="19" fill="#596575">Learning to make enterprise data reliable.</text><rect x="124" y="358" width="1212" height="88" rx="10" fill="#fff" stroke="#dde4ed"/><rect x="64" y="381" width="52" height="42" rx="8" fill="#fff1ec" stroke="#ead1c7"/><text x="90" y="408" text-anchor="middle" font-size="18" fill="#b5472b">02</text><text x="148" y="387" class="label">DISTRIBUTED SCALE</text><text x="148" y="419" font-size="20" font-weight="700" fill="#1e2530">Hadoop &amp; big data</text><text x="735" y="409" font-size="19" fill="#596575">Building and operating distributed systems at scale.</text><rect x="124" y="458" width="1212" height="88" rx="10" fill="#fff" stroke="#dde4ed"/><rect x="64" y="481" width="52" height="42" rx="8" fill="#fff1ec" stroke="#ead1c7"/><text x="90" y="508" text-anchor="middle" font-size="18" fill="#b5472b">03</text><text x="148" y="487" class="label">OPEN ARCHITECTURE</text><text x="148" y="519" font-size="20" font-weight="700" fill="#1e2530">Cloud · Open formats · Interoperability</text><text x="735" y="509" font-size="19" fill="#596575">Preserving choice as platform decisions evolve.</text><rect x="124" y="558" width="1212" height="88" rx="10" fill="#fff" stroke="#dde4ed"/><rect x="64" y="581" width="52" height="42" rx="8" fill="#fff1ec" stroke="#ead1c7"/><text x="90" y="608" text-anchor="middle" font-size="18" fill="#b5472b">04</text><text x="148" y="587" class="label">BUSINESS IMPACT</text><text x="148" y="619" font-size="20" font-weight="700" fill="#1e2530">People · Process · Technology</text><text x="735" y="609" font-size="19" fill="#596575">Putting actionable insights into business users’ hands.</text><rect x="124" y="658" width="1212" height="88" rx="10" fill="#fff" stroke="#dde4ed"/><rect x="64" y="681" width="52" height="42" rx="8" fill="#fff1ec" stroke="#ead1c7"/><text x="90" y="708" text-anchor="middle" font-size="18" fill="#b5472b">05</text><text x="148" y="687" class="label">DATA + AI LEADERSHIP</text><text x="148" y="719" font-size="20" font-weight="700" fill="#1e2530">Enterprise context · AI · Mentoring</text><text x="735" y="709" font-size="19" fill="#596575">Guiding teams within and across organizations.</text><text x="64" y="805" class="label">TWO EXPERIENCES THAT SHAPED MY PERSPECTIVE</text>
<rect x="64" y="834" width="624" height="217" rx="12" fill="#fff" stroke="#dde4ed"/><rect x="712" y="834" width="624" height="217" rx="12" fill="#fff" stroke="#dde4ed"/>
<text x="90" y="873" font-size="23" font-weight="700" fill="#1e2530">Open architecture. Three clouds.</text>
<text x="90" y="912" class="body"><tspan x="90">As leadership evaluated cloud platforms,</tspan><tspan x="90" dy="31">open data architecture helped me move</tspan><tspan x="90" dy="31">across three cloud environments.</tspan></text>
<text x="90" y="1027" font-size="18" fill="#b5472b">The lesson: preserve the ability to change.</text>
<text x="738" y="873" font-size="23" font-weight="700" fill="#1e2530">Business needs. A global application.</text>
<text x="738" y="912" class="body"><tspan x="738">I proposed, deployed, and scaled a custom</tspan><tspan x="738" dy="31">insights app globally, putting information</tspan><tspan x="738" dy="31">directly into business users’ hands.</tspan></text>
<text x="738" y="1027" font-size="18" fill="#b5472b">The lesson: design around the moment of use.</text>
<line x1="64" y1="1091" x2="1336" y2="1091" stroke="#dde4ed"/>
<text x="64" y="1127" class="label">EXPANDING RESPONSIBILITY</text>
<text x="64" y="1160" font-size="19" fill="#344354">Senior Data Engineer → Lead Data Engineer → Senior Solutions Architect → Data + AI leadership across organizations</text></svg>